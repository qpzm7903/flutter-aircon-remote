name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: ${{ github.event.repository.name }}
  # 正式签名证书 SHA-256（小写、无冒号）；tag 构建会校验 APK 签名证书与之一致
  EXPECTED_CERT_SHA256: 'f5180a84cc33145d6e0519be637bd5507926bb19da2fa82d5eeadd3e7380f3a6'

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: Prepare package metadata
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare package version
        id: version
        shell: bash
        run: |
          jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed -E 's/\+.*$//')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="$GITHUB_REF_NAME"
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -z "$jversion" ]; then
              jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed -E 's/\+.*$//')
            fi
          fi
          pubspec_version=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed -E 's/\+.*$//')
          if [[ "${{ github.ref_type }}" == "tag" && "$jversion" != "$pubspec_version" ]]; then
            echo "::error title=Version mismatch::Tag version $jversion != pubspec version $pubspec_version"
            exit 1
          fi
          echo "jversion=$jversion" >> $GITHUB_OUTPUT
          echo "Using version: $jversion"

      - name: Compute project name
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "Project name for Flutter: $projectName"

  test:
    needs: [ metadata ]
    runs-on: ubuntu-latest
    name: Run Dart tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    needs: [ metadata, test ]
    runs-on: ubuntu-latest
    name: Build Android APK
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 签名策略：
      # - tag (v*) 构建：必须有完整的 4 个签名 secrets，否则直接失败，绝不回退到 debug 密钥发布。
      # - 本仓库的 push / 同仓 PR：有 secrets 时用正式密钥；缺失时给出醒目 warning 并回退 debug 密钥。
      # - 来自 fork 的 PR：GitHub 不下发 secrets，回退 debug 密钥（notice），保证 fork PR 仍可构建。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        shell: bash
        run: |
          present=0
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] && present=$((present + 1))
          done
          if [[ "$present" -eq 4 ]]; then
            python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          Path('android/app/upload-keystore.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          props = {'storeFile': 'upload-keystore.jks', 'storePassword': os.environ['KEYSTORE_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS'], 'keyPassword': os.environ['KEY_PASSWORD']}
          Path('android/key.properties').write_text(''.join(f'{key}={escape(value)}\n' for key, value in props.items()))
          PYTHON
            echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
            echo "Release signing configured."
          elif [[ "$present" -ne 0 ]]; then
            echo "::error title=Release signing::Only $present of 4 signing secrets are set (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            exit 1
          elif [[ "$IS_TAG" == "true" ]]; then
            echo "::error title=Release signing::Tag build without signing secrets. Refusing to publish a debug-signed APK (users could not upgrade in place)."
            exit 1
          elif [[ "$IS_FORK_PR" == "true" ]]; then
            echo "SIGNING_MODE=debug" >> "$GITHUB_ENV"
            echo "::notice title=Release signing::Fork PR: secrets unavailable, building with the debug key (artifact not installable over official releases)."
          else
            echo "SIGNING_MODE=debug" >> "$GITHUB_ENV"
            echo "::warning title=Release signing::Signing secrets missing; APK is signed with an ephemeral debug key and cannot upgrade official releases in place."
          fi

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK signer
        shell: bash
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          grep -E 'certificate (DN|SHA-256)' <<<"$certs" || echo "$certs"
          if [[ "$SIGNING_MODE" == "release" ]] && grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error title=Release signing::Signing secrets were configured but the APK is debug-signed."
            exit 1
          fi
          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            if ! grep -qi "certificate SHA-256 digest: ${EXPECTED_CERT_SHA256}" <<<"$certs"; then
              echo "::error title=Release signing::Release APK signer certificate does not match the pinned SHA-256 ${EXPECTED_CERT_SHA256} (wrong or rotated keystore secret?)."
              exit 1
            fi
            echo "Signer certificate matches pinned SHA-256."
          fi

      - name: Rename Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          retention-days: 7

  release:
    needs: [ build-android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release

    steps:
      - name: Checkout code (for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)
          body_content=""
          if [[ -n "$prev_tag" ]]; then
            body_content=$(git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github" ":(exclude).gitea")
          else
            body_content="Initial release."
          fi
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
