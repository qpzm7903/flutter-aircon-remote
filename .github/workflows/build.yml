name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  FLUTTER_VERSION: '3.47.7'
  APP_NAME: ${{ github.event.repository.name }}

jobs:
  metadata:
    runs-on: ubuntu-latest
    name: Prepare package metadata
    outputs:
      app_version: ${{ steps.version.outputs.jversion }}
      project_name: ${{ steps.project.outputs.project_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare package version
        id: version
        shell: bash
        run: |
          jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            raw_tag="$GITHUB_REF_NAME"
            version=$(echo "$raw_tag" | sed -E 's/^[vV]//')
            jversion=$(echo "$version" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')
            if [ -z "$jversion" ]; then
              jversion=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            fi
          fi
          echo "jversion=$jversion" >> $GITHUB_OUTPUT
          echo "Using version: $jversion"

      - name: Compute project name
        id: project
        shell: bash
        run: |
          projectName=$(echo "${{ env.APP_NAME }}" | tr '-' '_')
          echo "project_name=$projectName" >> $GITHUB_OUTPUT
          echo "Project name for Flutter: $projectName"

  test:
    needs: [ metadata ]
    runs-on: ubuntu-latest
    name: Run Dart tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-android:
    needs: [ metadata, test ]
    runs-on: ubuntu-latest
    name: Build Android APK
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          Path('android/app/upload-keystore.jks').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:').replace(' ', '\\ ')
          props = {'storeFile': 'upload-keystore.jks', 'storePassword': os.environ['KEYSTORE_PASSWORD'], 'keyAlias': os.environ['KEY_ALIAS'], 'keyPassword': os.environ['KEY_PASSWORD']}
          Path('android/key.properties').write_text(''.join(f'{key}={escape(value)}\n' for key, value in props.items()))
          PYTHON
          fi

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename Android APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk ./${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          path: ${{ env.APP_NAME }}-${{ needs.metadata.outputs.app_version }}-android-aarch64.apk
          retention-days: 7

  release:
    needs: [ build-android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: release

    steps:
      - name: Checkout code (for changelog)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          current_tag=${GITHUB_REF#refs/tags/}
          prev_tag=$(git tag --sort=-version:refname | grep -v "^$current_tag$" | head -1)
          body_content=""
          if [[ -n "$prev_tag" ]]; then
            body_content=$(git log --pretty=format:"* %s (%h)" "$prev_tag".."$current_tag" -- . ":(exclude)docs" ":(exclude).github" ":(exclude).gitea")
          else
            body_content="Initial release."
          fi
          {
            echo "body<<EOF"
            echo "$body_content"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
